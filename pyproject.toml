[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentloopguard-sdk"
dynamic = ["version"]
description = "Detect and kill infinite AI agent loops before they burn your API budget."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Mohammed Rizwan Shaik", email = "shaikmohammedrizwanfaisal@gmail.com" },
]
keywords = [
    "ai",
    "agent",
    "loop-detection",
    "budget",
    "safety",
    "llm",
    "openai",
    "anthropic",
    "langchain",
    "guardrail",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ops-velro-services/agentloopguard"
Documentation = "https://github.com/ops-velro-services/agentloopguard#readme"
Repository = "https://github.com/ops-velro-services/agentloopguard"
Issues = "https://github.com/ops-velro-services/agentloopguard/issues"
Changelog = "https://github.com/ops-velro-services/agentloopguard/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.sdist]
include = [
    "/src/agentloopguard",
    "/LICENSE",
    "/README.md",
    "/VERSION",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentloopguard"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
